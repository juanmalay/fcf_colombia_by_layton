name: fcf_colombia_by_layton
description: App no oficial sobre la Selección Colombia de mayores.
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Estado
  flutter_riverpod: ^2.5.0

  # Navegación moderna
  go_router: ^14.2.0
  country_flags: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/data/
    - assets/images/
    - assets/history/
    - assets/multimedia/
