name: fcf_colombia_by_layton
description: App no oficial sobre la Selección Colombia de mayores.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^14.2.0

  # HTTP & API
  dio: ^5.3.0

  # Local Storage
  shared_preferences: ^2.2.0

  # Serialization
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0

  # Image Caching
  cached_network_image: ^3.3.0

  # Loading & Animations
  shimmer: ^3.0.0

  # Localization & Formatting
  intl: ^0.19.0
  mockito: ^5.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code Generation
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/data/
